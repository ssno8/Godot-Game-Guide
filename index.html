<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Sen:wght@400..800&display=swap" rel="stylesheet">
    <title>Godot Game Guide</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            list-style: 0;
            text-decoration: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }

        /* margin: top right bottom left */
        

        .darumadrop-one-regular {
            font-family: "Darumadrop One", sans-serif;
            font-weight: 400;
            font-style: normal;
        }



        .header {
            width: 100%;
            height: 100px;
            background-color: #FC8616;
            display: block;
        }

        .inner-header {
            width: 90%;
            height: 100%;
            display: block;
            margin: 0 auto;
        }
        
        .logo-container {
            height: 100%;
            display: table;
            float: left;
        }

        .logo-container .img-container {
            height: 100%;
            display: table-cell;
            vertical-align: middle;
            padding: 0 10px;
        }

        .logo-container .img-container img {
            height: 50px;
            width: 50px;
            margin: auto;
        }

        .logo-container h1 {
            color: black;
            height: 100%;
            display: table-cell;
            vertical-align: middle;
            font-size: 25px;          
            font-family: "Darumadrop One", sans-serif; 
        }

        .navigation {
            float: right;
            height: 100%;
        }

        .navigation a {
            height: 100%;
            display: table;
            float: left;
            padding: 0px 10px;
        }

        .navigation a li {
            display: table-cell;
            vertical-align: middle;
            font-size: 15px;
        }

    </style>
</head>

<body>
    <div class="header">
        <div class="inner-header">
            <div class="logo-container">
                <div class="img-container">
                    <img src="static/hedchog.png">
                </div>
                <h1>Godot Game Guide</h1>
            </div>

            <ul class="navigation">
                <a><li>Download</li></a>
                <a><li>Setup</li></a>
                <a><li>Create Game</li></a>
                <a><li>Export</li></a>
                <a><li>Ship</li></a>
            </ul>
        </div>
    </div>

    <div class="banner">
        <img height="auto" width="100%" src="static/banner v2.png">
    </div>
</body>

</html>
